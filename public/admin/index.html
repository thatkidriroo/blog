<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Write a post</title>
  <style>
    :root {
      --bg: #15181f;
      --card: #1d212b;
      --text: #e7e9ee;
      --text-dim: #9ca3af;
      --border: #2d313c;
      --accent: #6366f1;
      --accent-hover: #5558e6;
      --success: #22c55e;
      --error: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      line-height: 1.6;
      padding: 1em;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.4em;
      margin-bottom: 1em;
      padding-bottom: 0.5em;
      border-bottom: 1px solid var(--border);
    }
    .form-group {
      margin-bottom: 1em;
    }
    label {
      display: block;
      font-size: 0.88em;
      font-weight: 600;
      margin-bottom: 0.3em;
      color: var(--text-dim);
    }
    input, textarea {
      width: 100%;
      padding: 0.7em 0.9em;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1em;
      background: var(--card);
      color: var(--text);
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus {
      border-color: var(--accent);
    }
    textarea {
      resize: vertical;
    }
    textarea#content {
      min-height: 250px;
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 0.92em;
      line-height: 1.5;
    }
    .hint {
      font-size: 0.8em;
      color: var(--text-dim);
      margin-top: 0.3em;
      opacity: 0.7;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4em;
      padding: 0.75em 1.5em;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      width: 100%;
      justify-content: center;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .status {
      margin-top: 1em;
      padding: 0.8em 1em;
      border-radius: 10px;
      font-size: 0.9em;
      display: none;
    }
    .status.success { display: block; background: #052e16; color: var(--success); border: 1px solid #166534; }
    .status.error { display: block; background: #450a0a; color: var(--error); border: 1px solid #991b1b; }
    .status a { color: var(--accent); }
    .back-link {
      display: block;
      margin-top: 1.5em;
      text-align: center;
      font-size: 0.85em;
      color: var(--text-dim);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✏️ New Post</h1>
    <form id="postForm">
      <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" required placeholder="e.g. What I learned this week" />
      </div>
      <div class="form-group">
        <label for="description">Description</label>
        <input type="text" id="description" name="description" required placeholder="Short summary of the post" />
      </div>
      <div class="form-group">
        <label for="tags">Tags</label>
        <input type="text" id="tags" name="tags" placeholder="e.g. personal, tech, life" />
        <div class="hint">Comma-separated</div>
      </div>
      <div class="form-group">
        <label for="content">Content (Markdown)</label>
        <textarea id="content" name="content" required placeholder="Write your post here..."></textarea>
      </div>
      <button type="submit" class="btn" id="publishBtn">Publish</button>
    </form>
    <div id="status" class="status"></div>
    <a href="/" class="back-link">&larr; Back to blog</a>
  </div>

  <script>
    document.getElementById('postForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('publishBtn');
      const status = document.getElementById('status');
      const title = document.getElementById('title').value.trim();
      const description = document.getElementById('description').value.trim();
      const tagsRaw = document.getElementById('tags').value.trim();
      const content = document.getElementById('content').value.trim();

      if (!title || !description || !content) {
        status.className = 'status error';
        status.textContent = 'Please fill in title, description, and content.';
        return;
      }

      const tags = tagsRaw
        ? tagsRaw.split(',').map(t => t.trim().toLowerCase()).filter(Boolean)
        : [];

      btn.disabled = true;
      btn.textContent = 'Publishing...';
      status.className = 'status';
      status.textContent = '';

      try {
        const res = await fetch('/api/publish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, description, tags, content }),
        });
        const data = await res.json();

        if (res.ok) {
          status.className = 'status success';
          status.innerHTML = `Published! <a href="${data.url}" target="_blank">View post</a>`;
          document.getElementById('postForm').reset();
        } else {
          status.className = 'status error';
          status.textContent = data.error || 'Something went wrong.';
        }
      } catch (err) {
        status.className = 'status error';
        status.textContent = 'Network error. Check your connection.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Publish';
      }
    });
  </script>
</body>
</html>
